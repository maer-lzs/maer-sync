[package]
name = "maer-sync"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

# Fassungen mit `=` gepinnt:
# ein Wechsel ist ein Commit mit Grund, wie beim Abbild-Digest und beim Paket.
[dependencies]
serde_json = "=1.0.151"
serde = "=1.0.229"
sha2 = "=0.11.0"
# `static_secrets` ist in 3.0.0 nicht in der Vorgabe, traegt aber die
# Schnittstelle fuer einen EINGESPEISTEN Schluessel, und genau die braucht
# der Handschlag: die veroeffentlichten Vektoren geben die fluechtigen
# Schluessel vor. Ein Merkmal, kein neuer Crate (Baum unveraendert gemessen).
x25519-dalek = { version = "=3.0.0", features = ["static_secrets"] }
chacha20poly1305 = "=0.11.0"
hkdf = "=0.13.0"
# Echtes SQLite als C, statisch gelinkt, damit
# die vorhandene Datei dieselbe bleibt (Invariante 4). Gemessen fuer das
# Lieferstueck: neun Crates bauen fuer musl, die wasm-Anteile der Serie
# fallen dort weg. Neueste stabile Serie.
rusqlite = { version = "=0.40.2", features = ["bundled"] }
# Zeitkonstanter Vergleich. Gemessen: als DIREKTE Abhaengigkeit kostet er NULL
# zusaetzliche Crates, er liegt ohnehin zweifach im Baum (ueber
# curve25519-dalek). Von Hand vergleichen waere die Sorte Eigenbau, die an
# genau dieser Stelle teuer wird: ein Vergleich, der beim ersten falschen Byte
# zurueckkehrt, verraet das Geheimnis Byte fuer Byte.
subtle = "=2.6.1"

# Merkmale minimal und je mit ihrer Messung begruendet.

# Die Ableitung des Kontogeheimnisses. Vorgabe-Merkmale: gemessen macht
# `default-features = false` keinen Unterschied (beide plus drei), also bleibt
# die einfachere Schreibweise.
scrypt = "=0.12.0"

# Der Socket. Ohne Vorgaben, weil die Vorgabe TLS mitzieht und der Verkehr
# bereits versiegelt ist: gemessen null Crates der TLS-Familie im Baum.
tokio-tungstenite = { version = "=0.30.0", default-features = false }

# Die Wege. Nur was der Dienst spricht: HTTP/1.1 als Server, nichts weiter.
hyper = { version = "=1.11.1", features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio", "server"] }

# Die Laufzeit. `rt-multi-thread` statt `rt`, weil es gemessen KEINEN Crate
# mehr kostet und ein lauschender Socket sonst einen einzigen Faden belegt.
# OHNE `macros`: das spart gemessen einen Crate (das Proc-Macro), und die
# Laufzeit wird von Hand gebaut statt von einem Attribut.
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net"] }
