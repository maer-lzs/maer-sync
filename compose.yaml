# Mär Sync Service, run as a container.
#
# This file replaces the step of the guide that lets the service start by
# itself: `restart: unless-stopped` is the autostart. There is then no systemd
# unit, no system user of its own and no permissions to fix by hand on the
# store.
name: maer-sync

services:
  maer-sync:
    build: .
    image: maer-sync:local
    container_name: maer-sync
    restart: unless-stopped

    # Local only. What is reachable from outside is decided by the proxy in
    # front (the proxy step of the guide), and it is the proxy that terminates
    # TLS and has to pass the WebSocket upgrade through.
    #
    # The HOST port can be set, the service port cannot: inside it stays 8099,
    # and outside every host puts it where it has room. If 8099 is taken, set
    # MAER_SYNC_HOST_PORT and leave the file alone.
    #
    # Why a variable and not a second compose file: an override file does not
    # REPLACE the port list, it MERGES it. The second entry joins the first, the
    # container tries to bind both and fails on the one that is taken, which is
    # exactly the port you wanted to avoid. (`ports: !override` could do it from
    # Compose 2.24 on, but it again needs a second file for something one place
    # in this one settles.)
    ports:
      - "127.0.0.1:${MAER_SYNC_HOST_PORT:-8099}:8099"

    # A NAMED volume, no path in the image and no bind mount: the store survives
    # every new image this way, and it belongs to the uid from the Dockerfile.
    volumes:
      - maer-sync-store:/var/lib/maer-sync
      # The catalog of the fetch program, READ ONLY: the service holds the
      # sign-ins and gets no write right on the catalog (measured 25.11.2026,
      # it reads a cleanly closed catalog from a read-only mount).
      - maer-sync-katalog:/var/lib/maer-sync-katalog:ro

    # ONE address, `MAER_SYNC_BIND`: the Rust build does not know
    # `MAER_SYNC_HOST` or `MAER_SYNC_PORT`, and setting them gives no error but a
    # service on the default port 8081 that nobody asks.
    environment:
      MAER_SYNC_DB: /var/lib/maer-sync/store.sqlite
      MAER_SYNC_BIND: 0.0.0.0:8099
      MAER_SYNC_KATALOG: /var/lib/maer-sync-katalog/katalog.db
      # Whose `X-Real-IP` the service believes. In the container the peer is
      # NOT the loopback but the gateway of the bridge below: measured on
      # 24.09.2026, without this entry the attempt limit counted every device
      # under that one address, and ten failed attempts by a stranger locked
      # out the owner. The loopback stays in for the health check from inside.
      MAER_SYNC_TRUSTED_PROXIES: "127.0.0.1,::1,${MAER_SYNC_GATEWAY:-10.89.12.1}"

    # The image carries no curl and no Python, so the binary asks itself:
    # `health` asks /v1/health and exits with 0 or 1.
    healthcheck:
      test: ["CMD", "/maer-sync", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # An init in front of the service. Otherwise the service is PID 1 in the
    # container, and PID 1 has no default action for a signal: SIGTERM does
    # nothing, and every `stop` and every `restart` waited ten seconds and ended
    # in SIGKILL, exit code 137 (measured on 24.09.2026). The init is the one
    # Docker ships, no further dependency in the image.
    init: true

    security_opt:
      - no-new-privileges:true
    # Measured on 24.09.2026 against a copy of a real store (78 documents):
    # 8 MB while running, a peak of 14 MB with a backup (version 5), 17 MB with
    # version 6. The limit stays high anyway, because a single write may be as
    # large as MAER_SYNC_MAX_BODY_BYTES (64 MiB) and is held in memory before it
    # is judged.
    mem_limit: 256m
    pids_limit: 128

  # The fetch program of the catalog index: the only writer of the catalog,
  # without a port, without the user store. Measured 25.11.2026: a full run of
  # 190 000 rows peaked at 568 MB in a debug build, so 1 GB is the limit.
  maer-sync-abruf:
    build:
      context: .
      dockerfile: abruf/Dockerfile
    image: maer-sync-abruf:local
    container_name: maer-sync-abruf
    restart: unless-stopped
    volumes:
      - maer-sync-katalog:/var/lib/maer-sync-katalog
    environment:
      MAER_SYNC_KATALOG: /var/lib/maer-sync-katalog/katalog.db
    mem_limit: 1g
    init: true

volumes:
  maer-sync-katalog:
  maer-sync-store:

# A fixed network, so the gateway has a known address the list above can
# believe. Outside the ranges Docker hands out networks from by itself
# (`172.17` to `172.31`, `192.168`), so no other project takes it first. If it
# collides with an existing network on a host, set both variables together:
# MAER_SYNC_SUBNET and MAER_SYNC_GATEWAY.
networks:
  default:
    ipam:
      config:
        - subnet: ${MAER_SYNC_SUBNET:-10.89.12.0/29}
          gateway: ${MAER_SYNC_GATEWAY:-10.89.12.1}
