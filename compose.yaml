# Mär Sync Service — Betrieb als Container.
#
# Diese Datei ersetzt Schritt 7 der Anleitung: `restart: unless-stopped` ist der
# Autostart. Es gibt dann keine systemd-Unit, keinen eigenen Systemnutzer und
# keine Rechte, die man am Speicherort von Hand richten muss.
name: maer-sync

services:
  maer-sync:
    build: .
    image: maer-sync:local
    container_name: maer-sync
    restart: unless-stopped

    # Nur lokal. Was von aussen erreichbar sein soll, entscheidet die Vorschaltung
    # aus Schritt 6 — und die ist es, die TLS terminiert und den WebSocket-Aufstieg
    # durchreichen muss.
    #
    # Der HOST-Port ist einstellbar, der Dienst-Port nicht: innen bleibt es 8099,
    # nach aussen legt ihn jeder Wirt dorthin, wo bei ihm Platz ist. Wer 8099 schon
    # belegt hat, setzt MAER_SYNC_HOST_PORT und laesst die Datei in Ruhe.
    #
    # Warum eine Variable und keine zweite compose-Datei: eine Override-Datei
    # ERSETZT die Portliste nicht, sie FUEHRT SIE ZUSAMMEN. Der zweite Eintrag
    # tritt neben den ersten, der Container versucht beide zu binden und scheitert
    # an dem, der belegt ist — also genau an dem Port, dem man ausweichen wollte.
    # (`ports: !override` koennte das ab Compose 2.24, verlangt aber wieder eine
    # zweite Datei fuer etwas, das eine Stelle in dieser hier loest.)
    ports:
      - "127.0.0.1:${MAER_SYNC_HOST_PORT:-8099}:8099"

    # BENANNTES Volume, kein Pfad im Abbild und kein bind mount: die Ablage
    # überlebt damit jedes neue Abbild, und sie gehört der UID aus dem Dockerfile.
    volumes:
      - maer-sync-store:/var/lib/maer-sync

    # EINE Adresse, `MAER_SYNC_BIND`: die Rust-Fassung kennt `MAER_SYNC_HOST`
    # und `MAER_SYNC_PORT` nicht, und wer sie setzt, bekommt keinen Fehler,
    # sondern einen Dienst auf dem Vorgabeport 8081, den niemand fragt.
    environment:
      MAER_SYNC_DB: /var/lib/maer-sync/store.sqlite
      MAER_SYNC_BIND: 0.0.0.0:8099
      # Wem der Dienst `X-Real-IP` glaubt. Im Container ist die Gegenstelle
      # NICHT die Schleife, sondern das Tor der Bruecke unten: gemessen am
      # 24.09.2026, ohne diesen Eintrag zaehlte die Versuchsgrenze jedes Geraet
      # unter dieser einen Adresse, und zehn Fehlversuche eines Fremden sperrten
      # den Besitzer. Die Schleife bleibt drin fuer den Health-Check von innen.
      MAER_SYNC_TRUSTED_PROXIES: "127.0.0.1,::1,${MAER_SYNC_GATEWAY:-10.89.12.1}"

    # Das Abbild traegt kein curl und kein Python, also fragt das Binary sich
    # selbst: `health` fragt /v1/health und endet mit 0 oder 1.
    healthcheck:
      test: ["CMD", "/maer-sync", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Ein Init vor dem Dienst. Im Container ist der Dienst sonst PID 1, und fuer
    # PID 1 gilt kein Vorgabe-Verhalten eines Signals: SIGTERM verpufft, und
    # jeder `stop` und jeder `restart` wartete zehn Sekunden und endete mit
    # SIGKILL, Ausgang 137 (gemessen am 24.09.2026). Das Init ist das von Docker
    # mitgelieferte, keine weitere Abhaengigkeit im Abbild.
    init: true

    security_opt:
      - no-new-privileges:true
    # Gemessen am 24.09.2026 gegen eine Kopie eines echten Bestands (78
    # Dokumente): 8 MB im Lauf, Spitze 14 MB mit Sicherung (Fassung 5), 17 MB
    # mit Fassung 6. Die Grenze bleibt
    # trotzdem hoch, weil ein einzelner Schrieb bis MAER_SYNC_MAX_BODY_BYTES
    # (64 MiB) gross sein darf und im Speicher liegt, bevor er geprueft wird.
    mem_limit: 256m
    pids_limit: 128

volumes:
  maer-sync-store:

# Ein festes Netz, damit das Tor eine bekannte Adresse hat, der die Liste oben
# glauben kann. Ausserhalb der Adressbereiche, aus denen Docker selbst Netze
# vergibt (`172.17` bis `172.31`, `192.168`), damit kein anderes Projekt es
# vorher belegt. Kollidiert es auf einem Wirt mit einem vorhandenen Netz, beide
# Variablen zusammen setzen: MAER_SYNC_SUBNET und MAER_SYNC_GATEWAY.
networks:
  default:
    ipam:
      config:
        - subnet: ${MAER_SYNC_SUBNET:-10.89.12.0/29}
          gateway: ${MAER_SYNC_GATEWAY:-10.89.12.1}
