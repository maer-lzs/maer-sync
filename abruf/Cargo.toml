# The fetch program of the catalog index, a package of its own with a lock
# file of its own: the crates it needs to read the sources never enter the
# tree of the service, whose Cargo.toml, Cargo.lock and Dockerfile stay as
# they are.

[package]
name = "maer-sync-abruf"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
maer-sync = { path = ".." }
serde_json = "=1.0.151"
# HTTPS client of the fetch program only:
# rustls with the compiled-in Mozilla roots (webpki-roots), gzip included.
# Measured 25.11.2026: 18 new crates, builds with Rust 1.85, +1.76 MB.
ureq = "=3.5.2"
# The catalog dump of Project Gutenberg (pg_catalog.csv): quotes and line
# breaks inside fields. Measured 27.11.2026: csv, csv-core, ryu new, builds
# with Rust 1.85; Unlicense or MIT, ryu Apache-2.0 or BSL-1.0.
csv = "=1.4.0"
# The record of a Gutenberg work (pg<n>.rdf). Measured 27.11.2026: one new
# crate, MIT OR Apache-2.0, builds with Rust 1.85.
roxmltree = "=0.21.2"

[dev-dependencies]
# The witnesses read the catalog file directly; the same pin as the service.
rusqlite = { version = "=0.40.2", features = ["bundled"] }
